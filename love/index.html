<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta property="og:title" content="For you, my love"><meta property="og:description" content="Something I made for you."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>For You, My Love</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Caveat:wght@500;600&family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one small book on a dark table. One page at a time; tap the right side (or swipe) to turn it. */
:root {
  --table: #1c1219;       /* the dark ground the book rests on */
  --cover: #6e2f45;       /* cloth cover */
  --foil: #e9c9a0;        /* foil lettering on the cover */
  --paper: #f6ebe4;       /* page paper, slightly pink */
  --ink: #3a2131;         /* handwriting */
  --faint: rgba(58,33,49,.45);
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--table); color: var(--foil); overflow: hidden;
  background-image: radial-gradient(ellipse 70% 60% at 50% 45%, #2e1c27, var(--table) 75%);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; place-items: center; font-family: var(--hand);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.stage { display: grid; justify-items: center; gap: 18px; width: 100%; }

.book { position: relative; width: min(420px, 100%, calc((100vh - 220px) * .72)); aspect-ratio: 5 / 7; perspective: 1800px; touch-action: none; }
/* opening: the book rises out of the dark onto the table, then the cover lifts a little to say "open me" */
.book.intro { animation: arrive 1.6s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arrive { from { opacity: 0; transform: translateY(70px) rotateX(28deg) scale(.88); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
.leaf.cover.peek { animation: peek 1.8s ease-in-out 2; }
@keyframes peek { 0%, 100% { transform: rotateY(0); } 45% { transform: rotateY(-22deg); } }
.glow { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(233,201,160,.22), transparent 45%); animation: glow 2.4s ease-out both; }
@keyframes glow { from { opacity: 0; } 40% { opacity: 1; } to { opacity: .35; } }
.hint { font-size: 20px; color: var(--foil); opacity: 0; animation: fadein 1s ease 1.8s forwards; min-height: 1.5em; margin: -6px 0 0; }
@keyframes fadein { to { opacity: .75; } }
.stage > .controls { opacity: 0; animation: fadein 1s ease 1.4s forwards; }
.book::before { /* the pages underneath, seen at the edge */
  content: ""; position: absolute; inset: 6px -6px -6px 6px; background: #e7d7ce; border-radius: 2px 8px 8px 2px;
  box-shadow: 0 30px 60px rgba(0,0,0,.55), 2px 2px 0 #dccabf, 4px 4px 0 #d3bfb3; }

.leaf { position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d;
  transition: transform .9s cubic-bezier(.3,.1,.2,1); cursor: pointer; }
.leaf.turned { transform: rotateY(-180deg); }
.leaf.dragging { transition: none; }
.front::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: var(--p, 0);
  background: linear-gradient(to left, rgba(40,20,30,.35), transparent 70%); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 2px 8px 8px 2px; overflow: hidden; }
.front { background: var(--paper); color: var(--ink);
  background-image: linear-gradient(to right, rgba(58,33,49,.12), transparent 7%); }
.back { transform: rotateY(180deg); background: #efe2da; background-image: linear-gradient(to left, rgba(58,33,49,.12), transparent 7%); }

/* cover */
.cover .front { background: var(--cover); color: var(--foil); display: grid; place-items: center; text-align: center;
  background-image: linear-gradient(to right, rgba(0,0,0,.28), transparent 9%), repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
  box-shadow: inset 0 0 0 10px rgba(0,0,0,.08), inset 0 0 0 12px rgba(233,201,160,.35); }
.cover h1 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(34px, 9vw, 50px); line-height: 1.1; margin: 0; text-wrap: balance; padding: 0 24px; }
.cover .rule { width: 40px; height: 1px; background: var(--foil); opacity: .6; margin: 18px auto; }
.cover small { font-size: 22px; opacity: .8; }

/* paper pages */
.page { position: absolute; inset: 0; padding: 11% 10% 13% 13%; display: flex; flex-direction: column; overflow: auto; }
.page > * { flex-shrink: 0; }   /* never squeeze a heading or picture; extra words go overleaf */
.lined { background-image: repeating-linear-gradient(transparent 0 33px, rgba(58,33,49,.09) 33px 34px); background-position: 0 calc(11% + 26px); }
.words { font-size: clamp(20px, 5.4vw, 25px); line-height: 34px; }
.words p { margin: 0 0 34px; }
.right { text-align: right; }
.photo { margin: auto 0; display: grid; gap: 14px; justify-items: center; }
.photo .frame { background: #fff; padding: 9px 9px 0; box-shadow: 0 8px 20px rgba(58,33,49,.22); rotate: -1.5deg; width: 100%; }
.leaf:nth-child(even) .photo .frame { rotate: 1.4deg; }
.photo .img { aspect-ratio: 4 / 5; max-width: 100%; background: #eadcd8; display: grid; place-items: center; overflow: hidden; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .empty { color: var(--faint); font-size: 22px; }
.photo .cap { font-size: clamp(22px, 5.6vw, 27px); text-align: center; padding: 8px 4px 12px; }
.folio { position: absolute; bottom: 5%; left: 0; right: 0; text-align: center; font-size: 18px; color: var(--faint); }
.toc { display: grid; gap: 22px; margin: auto 0; }   /* sits in the middle of the page, like the first list page */
.toc h2 { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(30px, 8vw, 38px); margin: 0; text-align: center; }
.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.scene { height: 170px; margin: 0 0 34px; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 16px rgba(58,33,49,.25); rotate: -.6deg; }
.scene svg { display: block; width: 100%; height: 100%; }
.scene .tw circle { fill: #fff3e2; animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene .tw circle:nth-child(3n) { animation-delay: -1s; } .scene .tw circle:nth-child(3n+1) { animation-delay: -2s; animation-duration: 4s; }
@keyframes twinkle { 50% { opacity: .25; transform: scale(.6); } }
.scene .mglow { animation: moon 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes moon { 50% { opacity: .6; transform: scale(1.08); } }
.scene .shoot { opacity: 0; animation: shoot 7s linear infinite 1.5s; }
@keyframes shoot { 0% { opacity: 0; transform: translate(0, 0); } 2% { opacity: 1; } 8% { opacity: 0; transform: translate(-60px, 26px); } 100% { opacity: 0; transform: translate(-60px, 26px); } }
.scene .her, .scene .him { transform-box: fill-box; transform-origin: bottom center; animation: sway 4s ease-in-out infinite; }
.scene .him { animation-delay: -2s; }
@keyframes sway { 50% { transform: rotate(1.6deg); } }
.scene .hrt { transform-box: fill-box; transform-origin: center; animation: rise 4s ease-out infinite; }
@keyframes rise { 0% { opacity: 0; transform: translateY(8px) scale(.5); } 20% { opacity: 1; } 80% { opacity: .9; } 100% { opacity: 0; transform: translateY(-40px) scale(1.15); } }
.scene .ff circle { animation: drift 6s ease-in-out infinite; }
.scene .ff circle:nth-child(2) { animation-delay: -1.5s; animation-duration: 7s; } .scene .ff circle:nth-child(3) { animation-delay: -3s; } .scene .ff circle:nth-child(4) { animation-delay: -4.5s; animation-duration: 8s; } .scene .ff circle:nth-child(5) { animation-delay: -2.2s; }
@keyframes drift { 0%, 100% { transform: translate(0, 0); opacity: .2; } 30% { opacity: 1; } 50% { transform: translate(10px, -12px); opacity: .8; } 75% { transform: translate(-6px, -6px); opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .scene * { animation: none !important; } .scene .hrt { opacity: 1; } }
.scene-art { height: 272px; width: 245px; max-width: 100%; align-self: center; background: #fdfaf7; padding: 9px 9px 36px; border-radius: 2px; rotate: -1.4deg;   /* the drawing, as a square polaroid */
  box-shadow: 0 1px 2px rgba(58,33,49,.18), 0 10px 22px rgba(58,33,49,.28); overflow: visible; }
.scene-art { position: relative; }
.pol-cap { position: absolute; left: 6px; right: 6px; bottom: 6px; text-align: center; font-family: var(--hand); font-size: 17px; line-height: 24px; color: var(--ink); opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb-pic > .scene-art .pol-cap { position: static; font-size: 24px; padding-top: 8px; }
.lb-pic > .scene-art { padding-bottom: 10px; }
.scene-art img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; user-select: none; }
.lb-pic > .scene-art { width: min(90vw, 560px); height: auto; }
.lb-pic > .scene-art img { height: auto; aspect-ratio: 1; }
.scene-texts { height: 272px; background: #fdfaf7; padding: 9px 9px 36px; border-radius: 2px; rotate: -1.4deg;   /* a polaroid: white frame, deeper at the bottom */
  box-shadow: 0 1px 2px rgba(58,33,49,.18), 0 10px 22px rgba(58,33,49,.28); overflow: visible; }
.scene-texts svg { background: #1a1020; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.scene-texts text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 700; font-size: 8.5px; }
.scene-texts .tx-snow circle { animation: tx-fall 5s linear infinite; }
@keyframes tx-fall { from { transform: translate(0, 0); } to { transform: translate(4px, 52px); } }
.scene-texts .tx-moon { animation: moon 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-texts .tx-pglow { animation: tx-flicker 3s ease-in-out infinite; }
@keyframes tx-flicker { 50% { opacity: .7; } }
/* the story, 20 seconds on a loop: Hi at 0.5s; her phone buzzes; she wakes at 5.5s; typing;
   her replies at 8.2s, 9.2s and 10.2s; everything stays until 18.5s (8+ seconds), then fades. */
.scene-texts .tx-b, .scene-texts .tx-typing, .scene-texts .tx-hand, .scene-texts .tx-love, .scene-texts .tx-zzz, .scene-texts .tx-buzz, .scene-texts .tx-bedphone, .scene-texts .tx-read { animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: ease-out; transform-box: fill-box; }
.scene-texts .tx-b { opacity: 0; transform-origin: right bottom; }
.scene-texts .tx-hi { animation-name: tx-hi; }
@keyframes tx-hi { 0%, 2.4% { opacity: 0; transform: translateY(6px) scale(.3); } 3.6% { opacity: 1; transform: translateY(-1px) scale(1.12); } 4.4% { transform: scale(.96); } 5.2%, 92.5% { opacity: 1; transform: none; } 97.5%, 100% { opacity: 0; transform: none; } }
.scene-texts .tx-b2 { animation-name: tx-b2; } .scene-texts .tx-b3 { animation-name: tx-b3; } .scene-texts .tx-b4 { animation-name: tx-b4; }
@keyframes tx-b2 { 0%, 40.9% { opacity: 0; transform: translateY(6px) scale(.3); } 42.1% { opacity: 1; transform: translateY(-1px) scale(1.12); } 42.9% { transform: scale(.96); } 43.7%, 92.5% { opacity: 1; transform: none; } 97.5%, 100% { opacity: 0; transform: none; } }
@keyframes tx-b3 { 0%, 45.9% { opacity: 0; transform: translateY(6px) scale(.3); } 47.1% { opacity: 1; transform: translateY(-1px) scale(1.1); } 47.9% { transform: scale(.97); } 48.7%, 92.5% { opacity: 1; transform: none; } 97.5%, 100% { opacity: 0; transform: none; } }
@keyframes tx-b4 { 0%, 50.9% { opacity: 0; transform: translateY(6px) scale(.3); } 52.1% { opacity: 1; transform: translateY(-1px) scale(1.15); } 52.9% { transform: scale(.95); } 53.7%, 92.5% { opacity: 1; transform: none; } 97.5%, 100% { opacity: 0; transform: none; } }
.scene-texts .tx-read { animation-name: tx-read; opacity: 0; font-size: 6px; font-weight: 500; }
@keyframes tx-read { 0%, 29% { opacity: 0; } 31%, 92.5% { opacity: 1; } 97.5%, 100% { opacity: 0; } }
.scene-texts .tx-typing { animation-name: tx-typing; opacity: 0; transform-origin: right bottom; }
@keyframes tx-typing { 0%, 30% { opacity: 0; transform: scale(.5); } 31.5%, 40% { opacity: 1; transform: none; } 41%, 100% { opacity: 0; } }
.scene-texts .tx-typing circle { animation: tx-dot 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.scene-texts .tx-typing .d2 { animation-delay: .15s; } .scene-texts .tx-typing .d3 { animation-delay: .3s; }
@keyframes tx-dot { 50% { transform: translateY(-2px); opacity: .5; } }
.scene-texts .tx-bedphone { animation-name: tx-bedphone; }
@keyframes tx-bedphone { 0%, 27.5% { opacity: 1; } 28.5%, 98% { opacity: 0; } 100% { opacity: 1; } }
.scene-texts .tx-buzz { animation-name: tx-buzz; opacity: 0; transform-origin: center; }
@keyframes tx-buzz { 0%, 7% { opacity: 0; } 7.5% { opacity: 1; transform: translateX(-1px); } 8% { transform: translateX(1px); } 8.5% { transform: translateX(-1px); } 9% { transform: translateX(1px); } 9.5% { transform: none; } 14% { opacity: 1; } 15.5% { opacity: .15; } 16.5% { opacity: 1; transform: translateX(-1px); } 17% { transform: translateX(1px); } 17.5% { transform: translateX(-1px); } 18% { transform: none; } 22.5%, 100% { opacity: 0; } }
.scene-texts .tx-zzz { animation-name: tx-zzz; }
@keyframes tx-zzz { 0%, 25% { opacity: 1; transform: translateY(0); } 12% { transform: translateY(-2px); } 27.5%, 98% { opacity: 0; } 100% { opacity: 1; } }
.scene-texts .tx-hand { animation-name: tx-hand; opacity: 0; transform-origin: 50% 100%; }
@keyframes tx-hand { 0%, 27.5% { opacity: 0; transform: translateY(8px) rotate(14deg); } 29.5% { opacity: 1; transform: translateY(-1px) rotate(-3deg); } 31%, 95% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; } }
.scene-texts .tx-love { animation-name: tx-love; opacity: 0; transform-origin: center; }
@keyframes tx-love { 0%, 54% { opacity: 0; transform: translateY(6px) scale(.4); } 56% { opacity: 1; transform: translateY(0) scale(1.2); } 57.5% { transform: scale(1); } 76% { opacity: 1; transform: translateY(0); } 84%, 100% { opacity: 0; transform: translateY(-16px); } }
@media (prefers-reduced-motion: reduce) { .scene-texts .tx-b, .scene-texts .tx-hand, .scene-texts .tx-read { opacity: 1 !important; transform: none !important; } .scene-texts .tx-bedphone, .scene-texts .tx-zzz, .scene-texts .tx-typing, .scene-texts .tx-buzz, .scene-texts .tx-love { opacity: 0 !important; } }
.taped { position: relative; height: 238px; margin: 0 0 34px; }   /* first photo top left, second bottom right */
.taped .tp { position: absolute; width: 46%; height: 148px; }
.taped .tp:nth-child(1) { top: 12px; left: 3%; }
.taped .tp:nth-child(2) { bottom: 8px; right: 3%; translate: none; }
/* three photos: top left, top right (a little lower), and one taped across the middle at the bottom */
.taped.three { height: 272px; }
.taped.three .tp { width: 40%; height: 118px; }
.taped.three .tp:nth-child(1) { top: 10px; left: 2%; bottom: auto; right: auto; rotate: -5deg; }
.taped.three .tp:nth-child(2) { top: 26px; right: 2%; bottom: auto; left: auto; rotate: 4deg; }
.taped.three .tp:nth-child(3) { bottom: 6px; left: 30%; top: auto; right: auto; rotate: -1.5deg; }
.taped.three .tp:nth-child(2) .tape.b, .taped.three .tp:nth-child(2) .tape.c { display: none; }
.taped.three .tp:nth-child(2) .tape.a { left: auto; right: -12px; translate: none; top: -7px; rotate: 34deg; }
.taped.three .tp:nth-child(3) .tape.a { left: 50%; translate: -50% 0; top: -9px; rotate: -3deg; }
.taped.three .tp:nth-child(3) .tape.b { display: none; }
.tp { position: relative; margin: 0; background: #fdfaf7; padding: 4px; box-shadow: 0 1px 2px rgba(58,33,49,.2), 0 8px 16px rgba(58,33,49,.22); rotate: -4deg; min-width: 0; display: flex; flex-direction: column; }
.tp:nth-child(2) { rotate: 3.5deg; translate: 0 12px; }
.tp-img { flex: 1; min-height: 0; background: #eadcd8; display: grid; place-items: center; overflow: hidden; color: var(--faint); font-size: 18px; }
.tp-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tp figcaption { position: absolute; left: 0; right: 0; bottom: -22px; text-align: center; font-size: 16px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.tape { position: absolute; width: 46px; height: 15px; background: rgba(236, 222, 196, .78); box-shadow: 0 1px 2px rgba(58,33,49,.12);
  background-image: linear-gradient(90deg, rgba(255,255,255,.25) 0 2px, transparent 2px 6px); border-left: 2px dotted rgba(255,255,255,.5); border-right: 2px dotted rgba(255,255,255,.5); }
.tape.a { top: -8px; left: -12px; rotate: -38deg; }
.tape.b { top: -7px; right: -12px; rotate: 34deg; }
.tp:nth-child(2) .tape.a { left: 50%; translate: -50% 0; top: -9px; rotate: 4deg; }
.tape.c, .tape.d { display: none; }
.tp:nth-child(2) .tape.b { display: block; top: 46%; right: auto; left: -16px; rotate: 82deg; }
.tp:nth-child(2) .tape.c { display: block; top: auto; bottom: -6px; right: -13px; rotate: -36deg; }
.page-head { font-family: var(--display); font-style: italic; font-weight: 500; font-size: clamp(24px, 6.4vw, 30px); height: 34px; line-height: 34px; margin: 0; text-align: center; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-line { font-family: var(--display); font-style: italic; font-size: 14px; color: var(--faint); height: 34px; line-height: 34px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.words p.note { font-family: var(--display); font-style: italic; font-size: .75em; opacity: .5; }
.toc button { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; cursor: pointer; font-family: var(--hand); font-size: clamp(21px, 5.4vw, 25px); color: var(--ink); border-radius: 4px; }
.toc button:hover .t, .toc button:focus-visible .t { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.toc button:focus-visible { outline: 2px solid var(--cover); outline-offset: 2px; }
.toc .t { min-width: 0; }
.toc .dots { flex: 1; border-bottom: 2px dotted var(--faint); transform: translateY(-5px); min-width: 16px; }
.toc .n { font-variant-numeric: tabular-nums; }
.doodle-page { margin: auto 0; display: grid; place-items: center; padding-bottom: 6%; }
.doodle-page img { width: min(62%, 220px); height: auto; rotate: -6deg; opacity: .92; user-select: none; -webkit-user-drag: none; }
.doodle-page img.flip { rotate: 6deg; }
.dedication .doodle { width: clamp(72px, 24%, 104px); height: auto; justify-self: center; rotate: -6deg; margin: 2px 0; opacity: .92; user-select: none; -webkit-user-drag: none; }
.dedication { margin: auto 0; text-align: center; display: grid; gap: 14px; padding-bottom: 8%; }
.dedication p { margin: 0; font-family: var(--display); font-style: italic; font-size: clamp(26px, 7vw, 34px); line-height: 1.25; text-wrap: balance; }
.dedication .by { font-family: var(--hand); font-style: normal; font-size: clamp(22px, 5.6vw, 27px); opacity: .75; }
.end { margin: auto 0; text-align: center; font-size: clamp(26px, 7vw, 34px); line-height: 1.3; }

/* controls under the book */
.controls { display: flex; align-items: center; gap: 18px; font-size: 20px; color: var(--foil); }
.controls button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(233,201,160,.35); background: transparent; color: var(--foil); cursor: pointer; display: grid; place-items: center; }
.controls button { transition: transform .2s ease, background .2s ease, border-color .2s ease; }
.controls button:not(:disabled):hover { background: rgba(233,201,160,.1); border-color: rgba(233,201,160,.6); }
#next:not(:disabled):hover svg { transform: translateX(2px); } #prev:not(:disabled):hover svg { transform: translateX(-2px); }
.controls svg { transition: transform .2s ease; }
.controls button.pressed { animation: press .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes press { 30% { transform: scale(.84); background: rgba(233,201,160,.22); } 100% { transform: scale(1); } }
#next.pressed svg { animation: nudgeR .45s ease; } #prev.pressed svg { animation: nudgeL .45s ease; }
@keyframes nudgeR { 40% { transform: translateX(5px); } } @keyframes nudgeL { 40% { transform: translateX(-5px); } }
.controls button:disabled { opacity: .25; cursor: default; }
.controls button:focus-visible { outline: 2px solid var(--foil); outline-offset: 3px; }
.controls svg { width: 18px; height: 18px; }
#count { min-width: 64px; text-align: center; opacity: .8; font-variant-numeric: tabular-nums; }
.player { gap: 22px; margin-top: -6px; }
.stage > .player { animation: none; opacity: 1; transition: opacity .4s ease, visibility .4s; }
.stage > .player.off { opacity: 0; visibility: hidden; }   /* keeps its space, so the book never jumps in size */
.player button { position: relative; }
.player #back15 svg, .player #fwd15 svg { width: 30px; height: 30px; position: absolute; inset: 0; margin: auto; }
.player #back15 span, .player #fwd15 span { font-family: system-ui, sans-serif; font-size: 9px; font-weight: 600; position: relative; top: 1px; }

    var r = $('gift').getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .4, burst = $('burst');
    var beam = document.createElement('div'); beam.className = 'op-beam'; burst.appendChild(beam);
    var colors = ['#ffd98a', '#ffffff', '#ff9fbc', '#f3cf7a', '#ffc2d4'];
    for (var i = 0; i < (reduce ? 0 : 46); i++) {
      var b = document.createElement('i'), a = Math.random() * Math.PI * 2, dist = 80 + Math.random() * 190;
      if (i % 5 === 0) { b.className = 'h'; b.textContent = '♥'; } else b.style.background = colors[i % colors.length];
      b.style.left = cx + 'px'; b.style.top = cy + 'px';
      b.style.setProperty('--dx', Math.cos(a) * dist + 'px'); b.style.setProperty('--dy', (Math.sin(a) * dist - 80) + 'px');
      b.style.animationDelay = (Math.random() * .15) + 's'; burst.appendChild(b);
    }
    setTimeout(function () {
      document.body.classList.remove('waiting'); startBook(); SFX.whoosh();
      op.classList.add('done');
      setTimeout(function () { running = false; op.remove(); }, 1000);
    }, reduce ? 0 : 900);
  });
})();

// ---------------- the music menu (drops down like a game menu) ----------------
(function () {
  var list = $('tlList'), openGroups = {};
  function item(cls, label, sub, on, onClick, extra) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'tl-item ' + cls + (on ? ' on' : '');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    var cur = document.createElement('span'); cur.className = 'tl-cur'; cur.textContent = '▶'; cur.setAttribute('aria-hidden', 'true');
    var txt = document.createElement('span'); txt.className = 'tl-txt';
    var n = document.createElement('span'); n.className = 'tl-name'; n.textContent = label; txt.appendChild(n);
    if (sub) { var c = document.createElement('span'); c.className = 'tl-by'; c.textContent = sub; txt.appendChild(c); }
    var eq = document.createElement('span'); eq.className = 'tl-eq'; eq.setAttribute('aria-hidden', 'true'); eq.innerHTML = '<i></i><i></i><i></i>';
    b.appendChild(cur); b.appendChild(txt); if (extra) b.appendChild(extra); b.appendChild(eq);
    b.addEventListener('click', onClick);
    return b;
  }
  function draw(focusId) {
    list.innerHTML = '';
    TRACKS.forEach(function (t) {
      var li = document.createElement('li');
      if (t.versions) {
        var mine = t.versions.some(function (v) { return v.id === track; });
        if (openGroups[t.id] === undefined) openGroups[t.id] = mine;
        var arrow = document.createElement('span'); arrow.className = 'tl-arrow' + (openGroups[t.id] ? ' open' : ''); arrow.textContent = '▼'; arrow.setAttribute('aria-hidden', 'true');
        var head = item('tl-group', t.name, t.by, mine, function () { SFX.tick(); openGroups[t.id] = !openGroups[t.id]; draw(t.id); }, arrow);
        head.dataset.id = t.id; head.setAttribute('aria-expanded', openGroups[t.id] ? 'true' : 'false'); head.removeAttribute('aria-pressed');
        li.appendChild(head);
        var sub = document.createElement('ul'); sub.className = 'tl-sub' + (openGroups[t.id] ? ' open' : '');
        t.versions.forEach(function (v) {
          var sli = document.createElement('li');
          var b = item('tl-ver', v.name, '', v.id === track, function () { choose(v.id); }); b.dataset.id = v.id; b.tabIndex = openGroups[t.id] ? 0 : -1;
          sli.appendChild(b); sub.appendChild(sli);
        });
        li.appendChild(sub);
      } else {
        var b = item('', t.name, t.by, t.id === track, function () { choose(t.id); }); b.dataset.id = t.id; li.appendChild(b);
      }
      list.appendChild(li);
    });
    if (focusId) { var f = list.querySelector('[data-id="' + focusId + '"]'); if (f) f.focus(); }
  }
  function choose(id) {
    if (id === track) return;
    SFX.tick(); track = id; try { localStorage.setItem('bgm-track', id); } catch (e) {}
    draw(id);
    function load() { if (track === 'off') { bgm.removeAttribute('src'); bgm.load(); return; } bgm.src = trackSrc(track); try { bgm.currentTime = 0; } catch (e) {} if (!bgmOn) bgmOn = true; musicFor(); }
    if (!bgm.paused && !bgm._stop) { SFX.scratch(); recordStop(bgm, 650, load); } else load();
  }
  function isOpen() { return $('tl').classList.contains('in'); }
  function open(on) {
    if (on) { $('tl').hidden = false; void $('tl').offsetWidth; draw(); }
    $('tl').classList.toggle('in', on); $('tlBtn').setAttribute('aria-expanded', on ? 'true' : 'false');
    SFX.tick();
    if (on) { var cur = list.querySelector('.tl-item.on') || list.querySelector('.tl-item'); if (cur) cur.focus({ preventScroll: true }); }
    else setTimeout(function () { if (!isOpen()) $('tl').hidden = true; }, 450);
  }
  $('tlBtn').addEventListener('click', function (e) { e.stopPropagation(); open(!isOpen()); });
  $('tlBtn').addEventListener('pointerdown', function (e) { e.stopPropagation(); });
  $('tlClose').addEventListener('click', function () { open(false); $('tlBtn').focus(); });
  $('tl').addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (isOpen()) open(false); });
  // up and down move the ▶ cursor, like a game menu
  $('tl').addEventListener('keydown', function (e) {
    var items = [].slice.call(list.querySelectorAll('.tl-item')).filter(function (b) { return b.offsetParent && b.tabIndex !== -1; });
    var i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); var n = items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]; if (n) { n.focus(); SFX.tick(); } }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.stopPropagation();
    if (e.key === 'Escape') { e.stopPropagation(); open(false); $('tlBtn').focus(); }
  }, true);
  bgm.addEventListener('play', function () { $('tl').classList.add('playing'); });
  bgm.addEventListener('pause', function () { $('tl').classList.remove('playing'); });
  draw();
})();
</script>
