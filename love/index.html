<title>For You, My Love</title>
<meta property="og:title" content="For you, my love"><meta property="og:description" content="Something I made for you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Caveat:wght@500;600&display=swap">
<style>
  :root { --table:#1c1219; --cover:#6e2f45; --foil:#e9c9a0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--table); background-image: radial-gradient(ellipse 70% 60% at 50% 45%, #2e1c27, var(--table) 75%); color: var(--foil);
    display: grid; place-items: center; padding: 0 max(16px, env(safe-area-inset-left, 0px)); font-family: "Caveat", "Segoe Print", cursive; }
  .lock { width: min(340px, 100%); aspect-ratio: 5 / 7; background: var(--cover); border-radius: 3px 10px 10px 3px; display: grid; place-items: center; text-align: center;
    background-image: linear-gradient(to right, rgba(0,0,0,.28), transparent 9%), repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px);
    box-shadow: inset 0 0 0 10px rgba(0,0,0,.08), inset 0 0 0 12px rgba(233,201,160,.35), 0 30px 60px rgba(0,0,0,.55); padding: 28px; }
  h1 { font-family: "Bodoni Moda", Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(30px, 8vw, 40px); margin: 0 0 6px; }
  p { margin: 0 0 22px; font-size: 22px; opacity: .8; }
  form { display: grid; gap: 12px; width: 100%; }
  input { font: 600 24px "Caveat", cursive; text-align: center; color: #3a2131; background: #f6ebe4; border: 0; border-radius: 999px; padding: 10px 16px; width: 100%; outline: none; }
  input:focus-visible { box-shadow: 0 0 0 3px var(--foil); }
  button { font: 600 24px "Caveat", cursive; color: var(--table); background: var(--foil); border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .msg { min-height: 1.4em; font-size: 20px; color: #ffc2d4; margin: 4px 0 0; }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
  .lock.opening { animation: open .7s ease forwards; }
  @keyframes open { to { opacity: 0; transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { .shake, .lock.opening { animation: none; } }
</style></head><body>
<div class="lock" id="lock">

    <p>This book is just for you.</p>

function b(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function unlock(pw) {
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(BOOK.s), iterations: BOOK.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(BOOK.i) }, key, b(BOOK.c));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remembered) {
  try {
    var html = await unlock(pw);
    try { localStorage.setItem('book-pw', pw); } catch (e) {}
    if (remembered) { show(html); return; }
    document.getElementById('lock').classList.add('opening');
    setTimeout(function () { show(html); }, 650);
  } catch (e) {
    if (remembered) { try { localStorage.removeItem('book-pw'); } catch (x) {} return; }
    var l = document.getElementById('lock'); l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake');
    document.getElementById('msg').textContent = 'Not quite. Try again.';
    document.getElementById('pw').select();
  }
}
document.getElementById('f').addEventListener('submit', function (e) { e.preventDefault(); var v = document.getElementById('pw').value; if (v.trim()) tryOpen(v, false); });
// her phone remembers it after the first time
var saved = null; try { saved = localStorage.getItem('book-pw'); } catch (e) {}
if (saved) tryOpen(saved, true);
</script>
